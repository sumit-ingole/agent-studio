[project]
name = "adio-base"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
	"fastapi==0.115.6",
	"uvicorn[standard]==0.34.0",
	"pydantic-settings==2.7.1",
	"httpx==0.28.1",
	"PyJWT[crypto]==2.10.1",
	"SQLAlchemy[asyncio]==2.0.36",
	"asyncpg==0.30.0",
	"alembic==1.14.0",
	"slowapi==0.1.9",
]

[tool.ruff]
line-length = 100

[tool.pyright]
include = ["app"]
venvPath = "."
venv = ".venv"
